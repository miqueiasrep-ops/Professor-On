    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Sidebar Custom Scrollbar (Light/White for Dark Backgrounds) */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px; /* Aumentado para melhor visibilidade */
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05); /* Fundo leve para indicar a trilha */
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.5); /* Opacidade muito maior (0.5 vs 0.1) */
        border-radius: 20px;
        border: 2px solid rgba(30, 41, 59, 1); /* Borda da cor do fundo para criar efeito de espaçamento */
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.8); /* Quase branco ao passar o mouse */
      }

      /* Modal Custom Scrollbar (Dark/Zinc for White Backgrounds) */
      .scrollbar-zinc::-webkit-scrollbar {
        width: 6px;
      }
      .scrollbar-zinc::-webkit-scrollbar-track {
        background: transparent;
      }
      .scrollbar-zinc::-webkit-scrollbar-thumb {
        background-color: #cbd5e1; /* slate-300 */
        border-radius: 20px;
      }
      .scrollbar-zinc::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8; /* slate-400 */
      }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }

      /* Print Styles for PDF Generation (Fallback) */
      @media print {
        @page {
          margin: 2cm;
          size: auto;
        }
        body {
          background-color: white !important;
          color: black !important;
        }
        /* Hide UI elements */
        aside, .no-print, header {
          display: none !important;
        }
        /* Reset Layout */
        main {
          margin-left: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          max-width: none !important;
          overflow: visible !important;
        }
        /* Ensure containers are visible and clean */
        #root, .h-full {
          height: auto !important;
          overflow: visible !important;
        }
        /* Remove shadows and rounded corners for paper */
        .shadow-sm, .shadow-md, .shadow-xl {
          box-shadow: none !important;
        }
        .rounded-xl, .rounded-lg {
          border-radius: 0 !important;
        }
        /* Ensure borders are visible for readability */
        .border {
          border-color: #e5e7eb !important;
        }
      }
    </style>
